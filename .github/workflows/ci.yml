name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

env:
  CI: true

jobs:
  setup:
    name: Setup / Install
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.pnpm-cache.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/turbo.json') }}-${{ hashFiles('pnpm-lock.yaml') }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm run db:generate
      - name: Type Check
        run: pnpm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm run db:generate
      - name: Critical-fields CI gate (seeded hallucination must fail)
        run: pnpm --filter @repo/utils exec vitest run src/__tests__/critical-fields-ci-gate.test.ts src/__tests__/critical-fields.test.ts src/__tests__/field-trust.test.ts src/__tests__/agent-write-policy.test.ts
      - name: Tenant guard unit tests
        run: pnpm --filter clients-db exec vitest run src/__tests__/tenant-guard.test.ts src/__tests__/with-tenant.test.ts
      - name: Unit / Workspace Tests
        # Prefer failing unit tests; do not mask with e2e (agent-readiness F11)
        run: pnpm run test:unit
      - name: E2E / integration tests (non-blocking until fully green)
        continue-on-error: true
        run: pnpm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    env:
      # Build-time placeholders (same pattern as deploy.yml) — page-data
      # collection validates the Prisma datasource URL without connecting.
      DATABASE_URL: postgresql://user:pass@localhost:5432/test
      DIRECT_DATABASE_URL: postgresql://user:pass@localhost:5432/test
      NEXTAUTH_SECRET: ci-build-only-placeholder-secret
      JWT_SECRET: ci-build-only-placeholder-secret
      OPENAI_API_KEY: sk-ci-build-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm run db:generate
      - name: Build Packages / Apps
        run: pnpm run build

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit (fail on critical)
        run: pnpm audit --prod --audit-level=critical
